[base]
env_name = craftax

[vec]
total_agents = 8192
num_buffers = 16
num_threads = 18

[env]
seed_offset = 0
# Exact JAX-compatible seeded resets are the correctness default. A nonzero
# pool makes resets much faster, but intentionally limits world diversity and
# changes the seed-to-world mapping; opt into that approximation explicitly
# for throughput-only experiments.
reset_pool_size = 0

[train]
total_timesteps = 200_000_000
learning_rate = 0.008
ent_coef = 0.02
gamma = 0.997
gae_lambda = 0.95
horizon = 128
minibatch_size = 32768

[policy]
hidden_size = 32
num_layers = 1
expansion_factor = 1

[torch]
encoder = CraftaxEncoder
# M5 Pro, exact-reset CraftaxEncoder/MinGRU, horizon 16: direct MPS was 24%
# faster end-to-end than the CPU-actor hybrid at 128 agents (10-run median).
# At the configured horizon 128, final-source 8,192-agent throughput was
# 249,989 steps/s (245,319-252,133); the sizing run observed 4.39 GiB of MPS
# driver allocation. Larger 12,288/16,384 batches reduced sustained throughput
# and consumed 7.06/8.68 GiB, respectively.
mps_rollout_threshold = 128
