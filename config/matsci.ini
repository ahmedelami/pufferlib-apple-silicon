[base]
env_name = matsci

# The portable native backend is the default. It exactly implements the old
# LAMMPS model used here (pair_style zero, NVE timestep 0.5, periodic box).
# Build with `./build.sh matsci --lammps` only for an explicit reference run;
# installed LAMMPS headers never change this choice implicitly.

[vec]
num_envs = 8

[env]
num_envs = 8
num_atoms = 128

[train]
total_timesteps = 50_000_000
minibatch_size = 32768

