[base]
env_name = blastar

[vec]
total_agents = 4096

[env]
num_obs = 10

[train]
total_timesteps = 200_000_000
gamma = 0.95
learning_rate = 0.05
minibatch_size = 32768

[sweep]
metric = score
goal = maximize

[sweep.train.total_timesteps]
distribution = uniform
min = 10_000_000
max = 100_000_000
scale = auto
